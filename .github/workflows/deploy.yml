name: Deploy garden to GitHub Pages

on:
  push:
    branches: [v5]
  workflow_dispatch:
  repository_dispatch:
    types: [vault-updated]
  schedule:
    - cron: "17 * * * *" # mỗi giờ, phòng khi không gọi được từ repo vault

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout vault (obs-Personal - Private)
        uses: actions/checkout@v4
        with:
          repository: lynhuantung/obs-Personal
          ref: obs-Personal
          fetch-depth: 0
          token: ${{ secrets.VAULT_TOKEN || github.token }}
          path: vault-personal

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .quartz/plugins
          key: quartz-${{ hashFiles('package-lock.json', 'quartz.config.yaml') }}

      - run: npm ci

      - name: Lọc note dg-publish từ kho hợp nhất (obs-Personal)
        run: node scripts/sync-vault.mjs
        env:
          VAULT_DIR: "vault-personal/obs-Personal"
          HOME_TITLE: "TL wiki"

      - run: npx quartz plugin install
      - run: node scripts/patch-plugins.mjs
      - run: npx quartz build

      - name: Gắn nút Ghi chú ngẫu nhiên vào mọi trang
        run: node scripts/inject-random-note.mjs

      - name: Tính quan hệ ghi chú cho nút Ngẫu nhiên (gắn vào contentIndex trước khi mã hóa)
        run: node scripts/build-related.mjs

      - name: Mã hóa AES-256-GCM & gắn cổng đăng nhập GitHub Private
        run: node scripts/protect-site.mjs
        env:
          AUTH_CONFIG_PATH: "vault-personal/obs-Personal/.obsidian/tl-wiki-auth.json"
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
